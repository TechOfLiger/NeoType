<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeoType - Typing Speed Test</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="top">
    <h1 class="title">⌨ NeoType</h1>

    <div class="controls">

      <div class="control-box">
        <label>Time</label>
        <select id="timeSelect">
          <option value="60">1 Minute</option>
          <option value="120">2 Minutes</option>
          <option value="180">3 Minutes</option>
        </select>
      </div>

      <div class="control-box">
        <label>Words</label>
        <select id="wordSelect">
          <option value="20">20 Words</option>
          <option value="40">40 Words</option>
          <option value="60">60 Words</option>
          <option value="80">80 Words</option>
          <option value="100">100 Words</option>
        </select>
      </div>

    </div>
  </div>

  <div class="text-box" id="textDisplay"></div>

  <textarea id="inputField" placeholder="Start typing here..."></textarea>

  <div class="stats">

    <div class="card">
      <h2 id="time">60</h2>
      <p>Seconds Left</p>
    </div>

    <div class="card">
      <h2 id="wpm">0</h2>
      <p>Words Per Minute</p>
    </div>

    <div class="card">
      <h2 id="accuracy">100%</h2>
      <p>Accuracy</p>
    </div>

  </div>

  <div class="buttons">
    <button class="start" id="startBtn">Start Test</button>
    <button class="restart" id="restartBtn">Restart</button>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
